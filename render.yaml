# Render Blueprint for Overturn.  Dashboard -> New -> Blueprint -> pick your GitHub repo.
#
#   overturn : the web UI + API (Docker). Runs the pipeline, serves the front end.
#   ollama   : a PRIVATE service running the open-weight model. Only the web service can reach it,
#              so patient data never crosses the public internet. Needs a plan with enough RAM for the model.
#
# Free-tier note: free web services sleep when idle and cannot have disks; the model service needs a paid plan.
services:
  - type: web
    name: overturn
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_HOSTPORT          # filled in from the private service below -> http://<host>:<port>
        fromService:
          type: pserv
          name: ollama
          property: hostport
      - key: OVERTURN_MODEL
        value: qwen2.5:3b-instruct
      - key: DATABASE_URL             # optional: Tiger Cloud connection string -> BM25 + DiskANN hybrid search
        sync: false
      - key: SENTRY_DSN               # optional
        sync: false
      - key: PRIORLABS_API_KEY        # optional: TabPFN (only de-identified tabular features are sent)
        sync: false
      - key: BACKBOARD_API_KEY        # optional: model arena (sends SYNTHETIC notices to Backboard)
        sync: false
      - key: TEMPORAL_ADDRESS         # Temporal Cloud: <namespace>.<account>.tmprl.cloud:7233
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: TEMPORAL_UI              # Temporal Cloud UI URL for your namespace (shown as the 'open in Temporal UI' link)
        sync: false

  - type: pserv
    name: ollama
    runtime: docker
    dockerfilePath: ./deploy/ollama/Dockerfile
    dockerContext: ./deploy/ollama
    plan: pro                          # 3B model fits in about 4 GB RAM; the 7B needs more than the Pro instance provides
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 20
    envVars:
      - key: OVERTURN_MODEL
        value: qwen2.5:3b-instruct

  # Background worker: runs the appeal workflow (drafting happens here, so the web request does not have to wait).
  - type: worker
    name: overturn-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m overturn.temporal_workflow worker
    plan: starter                      # check Render's current plans; the worker only needs to reach Temporal Cloud, Postgres and Ollama
    envVars:
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OLLAMA_HOSTPORT
        fromService:
          type: pserv
          name: ollama
          property: hostport
      - key: OVERTURN_MODEL
        value: qwen2.5:3b-instruct
